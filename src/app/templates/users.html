{% extends "base.html" %}
{% block content %}
<style>
  .page-header {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: white;
    padding: 2rem;
    border-radius: 0.5rem;
    margin-bottom: 2rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .user-card {
    transition: transform 0.2s, box-shadow 0.2s;
    border-left: 4px solid #4facfe;
    cursor: pointer;
  }
  .user-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  }
</style>

<div class="page-header fade-in">
  <h1 class="mb-0"><i class="bi bi-people-fill"></i> Users</h1>
  <p class="mb-0 mt-2">View and connect with family members</p>
</div>

<div class="card shadow-sm mb-4">
  <div class="card-header bg-white">
    <h5 class="mb-0"><i class="bi bi-search"></i> Search Users</h5>
  </div>
  <div class="card-body">
    <input type="text" id="user-search" class="form-control" placeholder="Search by name or email...">
  </div>
</div>

<div id="users-container" class="row"></div>

<script>
let allUsers = [];

async function loadUsers() {
  try {
    const res = await fetch('/api/users');
    if (!res.ok) {
      throw new Error('Failed to load users');
    }
    allUsers = await res.json();
    renderUsers(allUsers);
  } catch (e) {
    console.error('Error loading users:', e);
    document.getElementById('users-container').innerHTML = `
      <div class="col-12">
        <div class="alert alert-danger">
          <i class="bi bi-exclamation-triangle-fill"></i> Failed to load users. Please try again.
        </div>
      </div>
    `;
  }
}

function renderUsers(users) {
  const container = document.getElementById('users-container');
  
  if (users.length === 0) {
    container.innerHTML = `
      <div class="col-12">
        <div class="alert alert-info">
          <i class="bi bi-info-circle-fill"></i> No users found.
        </div>
      </div>
    `;
    return;
  }
  
  container.innerHTML = users.map(u => {
    const fullName = [u.first_name, u.middle_name, u.last_name].filter(Boolean).join(' ');
    return `
      <div class="col-md-6 col-lg-4 mb-3 fade-in">
        <div class="card user-card h-100 shadow-sm" onclick="window.location.href='/users/${u.id}'">
          <div class="card-body">
            <h6 class="card-title">
              <i class="bi bi-person-circle"></i> ${u.display_name}
            </h6>
            ${fullName ? `<p class="text-muted small mb-2">${fullName}</p>` : ''}
            <p class="text-muted small mb-2">
              <i class="bi bi-envelope-fill"></i> ${u.email}
            </p>
            ${u.age !== null ? `<p class="text-muted small mb-2"><i class="bi bi-calendar-fill"></i> ${u.age} years old</p>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// Search functionality
document.getElementById('user-search').addEventListener('input', (e) => {
  const searchTerm = e.target.value.toLowerCase();
  const filtered = allUsers.filter(u => 
    u.display_name.toLowerCase().includes(searchTerm) ||
    u.email.toLowerCase().includes(searchTerm) ||
    (u.first_name && u.first_name.toLowerCase().includes(searchTerm)) ||
    (u.last_name && u.last_name.toLowerCase().includes(searchTerm))
  );
  renderUsers(filtered);
});

// Load users on page load
loadUsers();
</script>
{% endblock %}
