{% extends "base.html" %}
{% block content %}
<style>
  .page-header {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: white;
    padding: 2rem;
    border-radius: 0.5rem;
    margin-bottom: 2rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  
  #tree-container {
    background: white;
    border-radius: 0.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 2rem;
    overflow: auto;
    min-height: 600px;
    position: relative;
  }
  
  /* SVG Canvas for genogram */
  #genogram-svg {
    width: 100%;
    min-height: 800px;
  }
  /* SVG Canvas for genogram */
  #genogram-svg {
    width: 100%;
    min-height: 800px;
  }
  
  /* Genogram symbols */
  .genogram-person {
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .genogram-person:hover .person-shape {
    stroke-width: 3;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }
  
  /* Male symbol - square */
  .male-symbol {
    fill: #4A90E2;
    stroke: #2E5C8A;
    stroke-width: 2;
  }
  
  /* Female symbol - circle */
  .female-symbol {
    fill: #E94B8B;
    stroke: #B83567;
    stroke-width: 2;
  }
  
  /* Unknown/Other gender - diamond */
  .unknown-symbol {
    fill: #9B59B6;
    stroke: #6C3483;
    stroke-width: 2;
  }
  
  /* Current user - thicker border */
  .current-user .person-shape {
    stroke-width: 4;
    stroke: #F39C12;
    filter: drop-shadow(0 0 8px rgba(243, 156, 18, 0.6));
  }
  
  /* Deceased - X through symbol */
  .deceased-marker {
    stroke: #C0392B;
    stroke-width: 2;
    stroke-linecap: round;
  }
  
  /* Relationship lines */
  .parent-child-line {
    stroke: #34495E;
    stroke-width: 2;
    fill: none;
  }
  
  .marriage-line {
    stroke: #E74C3C;
    stroke-width: 3;
    fill: none;
  }
  
  .sibling-line {
    stroke: #34495E;
    stroke-width: 2;
    fill: none;
  }
  
  /* Person labels */
  .person-name {
    font-size: 12px;
    font-weight: 600;
    fill: #2C3E50;
    text-anchor: middle;
    pointer-events: none;
  }
  
  .person-age {
    font-size: 10px;
    fill: #7F8C8D;
    text-anchor: middle;
    pointer-events: none;
  }
  
  .person-dates {
    font-size: 9px;
    fill: #95A5A6;
    text-anchor: middle;
    pointer-events: none;
  }
  
  .relationship-label {
    font-size: 10px;
    font-style: italic;
    fill: #7F8C8D;
    text-anchor: middle;
  }
  .relationship-label {
    font-size: 10px;
    font-style: italic;
    fill: #7F8C8D;
    text-anchor: middle;
  }
  
  .loading-spinner {
    text-align: center;
    padding: 3rem;
  }
  
  .no-data {
    text-align: center;
    padding: 3rem;
    color: #6c757d;
  }
  
  .legend {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 2rem;
    padding: 1rem;
    background: #f8f9fa;
    border-radius: 0.5rem;
    flex-wrap: wrap;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .legend-symbol {
    width: 30px;
    height: 30px;
  }
  
  .legend-symbol.male {
    background: #4A90E2;
    border: 2px solid #2E5C8A;
  }
  
  .legend-symbol.female {
    background: #E94B8B;
    border: 2px solid #B83567;
    border-radius: 50%;
  }
  
  .legend-symbol.deceased {
    background: white;
    border: 2px solid #34495E;
    position: relative;
  }
  
  .legend-symbol.deceased::before,
  .legend-symbol.deceased::after {
    content: '';
    position: absolute;
    background: #C0392B;
    width: 2px;
    height: 35px;
    top: 50%;
    left: 50%;
  }
  
  .legend-symbol.deceased::before {
    transform: translate(-50%, -50%) rotate(45deg);
  }
  
  .legend-symbol.deceased::after {
    transform: translate(-50%, -50%) rotate(-45deg);
  }
  
  .legend-line {
    width: 40px;
    height: 3px;
    background: #34495E;
  }
  
  .legend-line.marriage {
    background: #E74C3C;
  }
</style>

<div class="page-header fade-in">
  <h1 class="mb-0"><i class="bi bi-diagram-3"></i> Family Genogram</h1>
  <p class="mb-0 mt-2">Interactive multi-generational family diagram</p>
</div>

<div id="tree-container">
  <div class="loading-spinner">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3">Loading your family genogram...</p>
  </div>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-symbol male"></div>
    <span>Male</span>
  </div>
  <div class="legend-item">
    <div class="legend-symbol female"></div>
    <span>Female</span>
  </div>
  <div class="legend-item">
    <div class="legend-symbol deceased"></div>
    <span>Deceased</span>
  </div>
  <div class="legend-item">
    <div class="legend-line marriage"></div>
    <span>Marriage</span>
  </div>
  <div class="legend-item">
    <div class="legend-line"></div>
    <span>Parent-Child</span>
  </div>
</div>

<script>
// Genogram constants
const SYMBOL_SIZE = 40;
const HORIZONTAL_SPACING = 180;
const VERTICAL_SPACING = 150;
const PERSON_LABEL_OFFSET = 55;

// Load and render family tree
async function loadFamilyTree() {
  try {
    const response = await fetch('/api/tree');
    console.log('API Response status:', response.status);
    console.log('Content-Type:', response.headers.get('content-type'));
    
    // Parse as JSON regardless of status - the API returns JSON for both success and errors
    const data = await response.json();
    
    if (!response.ok) {
      console.error('API Error:', data);
      throw new Error(data.error || `Failed to load family tree: ${response.status} ${response.statusText}`);
    }
    
    console.log('Family tree data:', data);
    renderGenogram(data);
  } catch (error) {
    console.error('Error loading family tree:', error);
    document.getElementById('tree-container').innerHTML = `
      <div class="no-data">
        <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: #dc3545;"></i>
        <p class="mt-3">Failed to load family genogram. Please try again later.</p>
        <p class="text-muted mt-2" style="font-size: 0.9rem;">${error.message}</p>
        <p class="text-muted mt-2" style="font-size: 0.8rem;">Check browser console (F12) for details.</p>
      </div>
    `;
  }
}

// Draw person symbol based on gender
function drawPersonSymbol(svg, x, y, person, isCurrent = false) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', `genogram-person ${isCurrent ? 'current-user' : ''}`);
  g.setAttribute('data-id', person.id);
  g.style.cursor = 'pointer';
  g.onclick = () => window.location.href = `/users/${person.id}`;
  
  let shape;
  
  // Draw shape based on gender
  if (person.sex === 'male' || person.sex === 'M') {
    // Male - Square
    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    shape.setAttribute('x', x - SYMBOL_SIZE/2);
    shape.setAttribute('y', y - SYMBOL_SIZE/2);
    shape.setAttribute('width', SYMBOL_SIZE);
    shape.setAttribute('height', SYMBOL_SIZE);
    shape.setAttribute('class', 'person-shape male-symbol');
  } else if (person.sex === 'female' || person.sex === 'F') {
    // Female - Circle
    shape = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    shape.setAttribute('cx', x);
    shape.setAttribute('cy', y);
    shape.setAttribute('r', SYMBOL_SIZE/2);
    shape.setAttribute('class', 'person-shape female-symbol');
  } else {
    // Unknown/Other - Diamond
    shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    shape.setAttribute('x', x - SYMBOL_SIZE/2);
    shape.setAttribute('y', y - SYMBOL_SIZE/2);
    shape.setAttribute('width', SYMBOL_SIZE);
    shape.setAttribute('height', SYMBOL_SIZE);
    shape.setAttribute('transform', `rotate(45 ${x} ${y})`);
    shape.setAttribute('class', 'person-shape unknown-symbol');
  }
  
  g.appendChild(shape);
  
  // Add X if deceased
  if (person.death_date) {
    const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line1.setAttribute('x1', x - SYMBOL_SIZE/2 + 5);
    line1.setAttribute('y1', y - SYMBOL_SIZE/2 + 5);
    line1.setAttribute('x2', x + SYMBOL_SIZE/2 - 5);
    line1.setAttribute('y2', y + SYMBOL_SIZE/2 - 5);
    line1.setAttribute('class', 'deceased-marker');
    
    const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line2.setAttribute('x1', x + SYMBOL_SIZE/2 - 5);
    line2.setAttribute('y1', y - SYMBOL_SIZE/2 + 5);
    line2.setAttribute('x2', x - SYMBOL_SIZE/2 + 5);
    line2.setAttribute('y2', y + SYMBOL_SIZE/2 - 5);
    line2.setAttribute('class', 'deceased-marker');
    
    g.appendChild(line1);
    g.appendChild(line2);
  }
  
  // Add name label
  const name = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  name.setAttribute('x', x);
  name.setAttribute('y', y + PERSON_LABEL_OFFSET);
  name.setAttribute('class', 'person-name');
  name.textContent = person.first_name || person.display_name;
  g.appendChild(name);
  
  // Add age if available
  if (person.age !== null && person.age !== undefined) {
    const age = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    age.setAttribute('x', x);
    age.setAttribute('y', y + PERSON_LABEL_OFFSET + 14);
    age.setAttribute('class', 'person-age');
    age.textContent = person.death_date ? `(${person.age})` : `Age ${person.age}`;
    g.appendChild(age);
  }
  
  // Add birth year if available
  if (person.birthday) {
    const birthYear = new Date(person.birthday).getFullYear();
    const dates = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    dates.setAttribute('x', x);
    dates.setAttribute('y', y + PERSON_LABEL_OFFSET + 26);
    dates.setAttribute('class', 'person-dates');
    dates.textContent = person.death_date ? 
      `${birthYear} - ${new Date(person.death_date).getFullYear()}` : 
      `b. ${birthYear}`;
    g.appendChild(dates);
  }
  
  svg.appendChild(g);
  return { x, y, person };
}

// Draw line between two points
function drawLine(svg, x1, y1, x2, y2, className) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x2);
  line.setAttribute('y2', y2);
  line.setAttribute('class', className);
  svg.insertBefore(line, svg.firstChild); // Insert at beginning so lines are behind symbols
  return line;
}

// Draw marriage line (horizontal line connecting spouses)
function drawMarriageLine(svg, x1, y1, x2, y2) {
  drawLine(svg, x1, y1, x2, y2, 'marriage-line');
}

// Draw partnership line based on relationship type
function drawPartnershipLine(svg, x1, y1, x2, y2, partnershipType) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x2);
  line.setAttribute('y2', y2);
  
  // Style based on relationship type
  if (partnershipType === 'married') {
    line.setAttribute('class', 'partnership-married');
    line.setAttribute('stroke', '#dc3545');
    line.setAttribute('stroke-width', '2');
  } else if (partnershipType === 'divorced') {
    // Solid line with two slashes
    line.setAttribute('class', 'partnership-divorced');
    line.setAttribute('stroke', '#6c757d');
    line.setAttribute('stroke-width', '2');
    svg.insertBefore(line, svg.firstChild);
    
    // Add two slash marks
    const midX = (x1 + x2) / 2;
    const slash1X = midX - 8;
    const slash2X = midX + 8;
    const slashY1 = y1 - 8;
    const slashY2 = y1 + 8;
    
    const slash1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    slash1.setAttribute('x1', slash1X);
    slash1.setAttribute('y1', slashY1);
    slash1.setAttribute('x2', slash1X);
    slash1.setAttribute('y2', slashY2);
    slash1.setAttribute('stroke', '#6c757d');
    slash1.setAttribute('stroke-width', '3');
    svg.insertBefore(slash1, svg.firstChild);
    
    const slash2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    slash2.setAttribute('x1', slash2X);
    slash2.setAttribute('y1', slashY1);
    slash2.setAttribute('x2', slash2X);
    slash2.setAttribute('y2', slashY2);
    slash2.setAttribute('stroke', '#6c757d');
    slash2.setAttribute('stroke-width', '3');
    svg.insertBefore(slash2, svg.firstChild);
    return;
  } else if (partnershipType === 'separated') {
    // Solid line with one slash
    line.setAttribute('class', 'partnership-separated');
    line.setAttribute('stroke', '#6c757d');
    line.setAttribute('stroke-width', '2');
    svg.insertBefore(line, svg.firstChild);
    
    const midX = (x1 + x2) / 2;
    const slash = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    slash.setAttribute('x1', midX);
    slash.setAttribute('y1', y1 - 8);
    slash.setAttribute('x2', midX);
    slash.setAttribute('y2', y1 + 8);
    slash.setAttribute('stroke', '#6c757d');
    slash.setAttribute('stroke-width', '3');
    svg.insertBefore(slash, svg.firstChild);
    return;
  } else if (partnershipType === 'common_law') {
    // Dashed line
    line.setAttribute('class', 'partnership-common-law');
    line.setAttribute('stroke', '#dc3545');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '5,5');
  } else if (partnershipType === 'engaged') {
    // Dashed line with "E"
    line.setAttribute('class', 'partnership-engaged');
    line.setAttribute('stroke', '#0dcaf0');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '5,5');
    svg.insertBefore(line, svg.firstChild);
    
    const midX = (x1 + x2) / 2;
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', midX);
    text.setAttribute('y', y1 - 10);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-size', '12');
    text.setAttribute('fill', '#0dcaf0');
    text.textContent = 'E';
    svg.appendChild(text);
    return;
  } else {
    // Default: simple line
    line.setAttribute('stroke', '#999');
    line.setAttribute('stroke-width', '2');
  }
  
  svg.insertBefore(line, svg.firstChild);
}

// Draw parent-child connection
function drawParentChildLine(svg, parentX, parentY, childX, childY) {
  // Vertical line from parent down
  const midY = parentY + VERTICAL_SPACING / 2;
  drawLine(svg, parentX, parentY + SYMBOL_SIZE/2, parentX, midY, 'parent-child-line');
  // Horizontal line to child's X position
  drawLine(svg, parentX, midY, childX, midY, 'parent-child-line');
  // Vertical line to child
  drawLine(svg, childX, midY, childX, childY - SYMBOL_SIZE/2, 'parent-child-line');
}

// Render the genogram
function renderGenogram(data) {
  console.log('Starting renderGenogram with data:', data);
  
  if (!data.people || Object.keys(data.people).length === 0) {
    document.getElementById('tree-container').innerHTML = `
      <div class="no-data">
        <i class="bi bi-info-circle" style="font-size: 3rem; color: #0dcaf0;"></i>
        <p class="mt-3">No family data available yet. Start by adding family relationships!</p>
      </div>
    `;
    return;
  }
  
  // Create SVG
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('id', 'genogram-svg');
  
  // Calculate generations for each person
  const generations = {};
  const personGeneration = {};
  const positionMap = {};
  
  // Assign generation 0 to root user
  personGeneration[data.root_id] = 0;
  
  // Build parent-child maps
  const childrenOf = {};  // parent_id -> [child_ids]
  const parentsOf = {};   // child_id -> [parent_ids]
  
  data.relationships.forEach(rel => {
    const [parentId, childId] = rel;
    if (!childrenOf[parentId]) childrenOf[parentId] = [];
    if (!parentsOf[childId]) parentsOf[childId] = [];
    childrenOf[parentId].push(childId);
    parentsOf[childId].push(parentId);
  });
  
  // Assign generations using BFS from root
  const queue = [data.root_id];
  const visited = new Set([data.root_id]);
  
  while (queue.length > 0) {
    const personId = queue.shift();
    const gen = personGeneration[personId];
    
    // Process parents (generation -1)
    if (parentsOf[personId]) {
      parentsOf[personId].forEach(parentId => {
        if (!visited.has(parentId)) {
          personGeneration[parentId] = gen - 1;
          visited.add(parentId);
          queue.push(parentId);
        }
      });
    }
    
    // Process children (generation +1)
    if (childrenOf[personId]) {
      childrenOf[personId].forEach(childId => {
        if (!visited.has(childId)) {
          personGeneration[childId] = gen + 1;
          visited.add(childId);
          queue.push(childId);
        }
      });
    }
  }
  
  // Organize people by generation
  Object.keys(data.people).forEach(personId => {
    const gen = personGeneration[personId] || 0;
    if (!generations[gen]) generations[gen] = [];
    generations[gen].push(data.people[personId]);
  });
  
  // Calculate positions
  const genKeys = Object.keys(generations).map(Number).sort((a, b) => a - b);
  const startY = 100;
  let maxX = 0;
  
  genKeys.forEach((gen, genIndex) => {
    const people = generations[gen];
    const yPos = startY + (genIndex * VERTICAL_SPACING);
    const totalWidth = people.length * HORIZONTAL_SPACING;
    const startX = (1200 - totalWidth) / 2 + HORIZONTAL_SPACING / 2; // Center on canvas
    
    people.forEach((person, index) => {
      const xPos = startX + (index * HORIZONTAL_SPACING);
      positionMap[person.id] = { x: xPos, y: yPos };
      if (xPos > maxX) maxX = xPos;
    });
  });
  
  // Set SVG dimensions
  const svgWidth = Math.max(1200, maxX + 200);
  const svgHeight = startY + (genKeys.length * VERTICAL_SPACING) + 100;
  svg.setAttribute('width', svgWidth);
  svg.setAttribute('height', svgHeight);
  svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
  
  // Draw partnership lines first
  if (data.partnerships) {
    data.partnerships.forEach(partnership => {
      const pos1 = positionMap[partnership.person1_id];
      const pos2 = positionMap[partnership.person2_id];
      if (pos1 && pos2 && pos1.y === pos2.y) { // Only if they're on same generation
        const x1 = pos1.x + SYMBOL_SIZE/2;
        const x2 = pos2.x - SYMBOL_SIZE/2;
        drawPartnershipLine(svg, x1, pos1.y, x2, pos2.y, partnership.relationship_type);
      }
    });
  }
  
  // Draw parent-child connection lines
  data.relationships.forEach(rel => {
    const [parentId, childId] = rel;
    const parentPos = positionMap[parentId];
    const childPos = positionMap[childId];
    if (parentPos && childPos) {
      drawParentChildLine(svg, parentPos.x, parentPos.y, childPos.x, childPos.y);
    }
  });
  
  // Draw all people
  Object.keys(data.people).forEach(personId => {
    const person = data.people[personId];
    const pos = positionMap[personId];
    if (pos) {
      drawPersonSymbol(svg, pos.x, pos.y, person, parseInt(personId) === data.root_id);
    }
  });
  
  // Replace container content with SVG
  document.getElementById('tree-container').innerHTML = '';
  document.getElementById('tree-container').appendChild(svg);
}

// Load tree when page loads
document.addEventListener('DOMContentLoaded', loadFamilyTree);
</script>
{% endblock %}
