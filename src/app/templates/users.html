{% extends "base.html" %}
{% block content %}
<style>
  .page-header {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: white;
    padding: 2rem;
    border-radius: 0.5rem;
    margin-bottom: 2rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .user-row {
    transition: background-color 0.2s;
  }
  .user-row:hover {
    background-color: #f8f9fa;
  }
</style>

<div class="page-header fade-in">
  <h1 class="mb-0"><i class="bi bi-people-fill"></i> User Management</h1>
  <p class="mb-0 mt-2">View and manage system users</p>
</div>

<div class="card shadow-sm mb-4">
  <div class="card-header bg-white">
    <h5 class="mb-0"><i class="bi bi-person-plus-fill"></i> Create New User</h5>
  </div>
  <div class="card-body">
    <form id="user-form" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" type="email" placeholder="user@example.com" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Display Name</label>
        <input class="form-control" name="display_name" placeholder="John Doe" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Password</label>
        <input class="form-control" name="password" type="password" placeholder="••••••••" required>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-check-circle-fill"></i> Create User
        </button>
        <button class="btn btn-success ms-2" id="seed-groups" type="button">
          <i class="bi bi-cloud-download-fill"></i> Seed Groups
        </button>
        <span id="user-msg" class="text-success ms-3"></span>
      </div>
    </form>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-header bg-white">
    <h5 class="mb-0"><i class="bi bi-list-ul"></i> All Users</h5>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-hover" id="users-table">
        <thead class="table-light">
          <tr>
            <th><i class="bi bi-hash"></i> ID</th>
            <th><i class="bi bi-envelope-fill"></i> Email</th>
            <th><i class="bi bi-person-fill"></i> Name</th>
            <th><i class="bi bi-shield-fill"></i> Groups</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
async function loadUsersPage() {
  const tableBody = document.querySelector('#users-table tbody');
  const load = async () => {
    try {
      const res = await fetch('/api/users');
      const users = await res.json();
      tableBody.innerHTML = users.map(u => `
        <tr class="user-row">
          <td><strong>${u.id}</strong></td>
          <td>${u.email}</td>
          <td>${u.display_name}</td>
          <td>
            ${(u.groups||[]).map(g => 
              `<span class="badge bg-primary me-1">${g}</span>`
            ).join('')}
          </td>
        </tr>
      `).join('');
      if (users.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No users found</td></tr>';
      }
    } catch (e) {
      tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Failed to load users</td></tr>';
      console.error(e);
    }
  };
  await load();
  
  document.getElementById('user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());
    try {
      const res = await fetch('/api/users', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        document.getElementById('user-msg').innerHTML = '<i class="bi bi-check-circle-fill"></i> User created successfully!';
        e.target.reset();
        await load();
        setTimeout(() => {
          document.getElementById('user-msg').textContent = '';
        }, 3000);
      } else {
        document.getElementById('user-msg').innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> Failed to create user';
      }
    } catch (e) {
      document.getElementById('user-msg').innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i> Error creating user';
      console.error(e);
    }
  });
  
  document.getElementById('seed-groups').addEventListener('click', async () => {
    try {
      await fetch('/api/users/seed-groups', { method: 'POST' });
      document.getElementById('user-msg').innerHTML = '<i class="bi bi-check-circle-fill"></i> Groups seeded successfully!';
      setTimeout(() => {
        document.getElementById('user-msg').textContent = '';
      }, 3000);
    } catch (e) {
      console.error(e);
    }
  });
}

document.addEventListener('DOMContentLoaded', loadUsersPage);
</script>
{% endblock %}
